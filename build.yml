name: Build and Release BrightnessTray

on:
  push:
    branches: [ master, main, feature/ddc-ci-multimonitor ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET Framework
      uses: microsoft/setup-msbuild@v1.1
    
    - name: Restore NuGet packages
      run: nuget restore BrightnessTray.sln
    
    - name: Build Release
      run: msbuild BrightnessTray.sln /p:Configuration=Release /p:Platform=x86
    
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v3
      with:
        name: BrightnessTray-Release
        path: bin/Release/
        retention-days: 30
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: bin/Release/BrightnessTray.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
